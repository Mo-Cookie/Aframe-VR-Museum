  <script src="https://unpkg.com/aframe-aabb-collider-component@3.1.0/dist/aframe-aabb-collider-component.min.js"></script>
  <script>
    AFRAME.registerComponent('collision-preventer', {
      schema: {
        target: {type: 'selector'}
      },
      init: function () {
        this.el.addEventListener('collide', this.onCollide.bind(this));
      },
      onCollide: function (evt) {
        if (evt.detail.body.el === this.data.target) {
          // Detén el movimiento de la cámara cuando ocurre una colisión
          const position = this.el.getAttribute('position');
          this.el.setAttribute('position', position); // Resetear la posición para prevenir movimiento
        }
      }
    });
  </script>
  <style>
    #joystickWrapper1 {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      z-index: 9999;

  <script src="Prueba.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const joystick = nipplejs.create({
        zone: document.getElementById('joystickWrapper1'),
        mode: 'static',
        position: { left: '50px', bottom: '50px' },
        color: 'red',
        size: 100
      });

      const maxSpeed = 0.03; // Velocidad máxima
      let currentDirection = { x: 0, y: 0 };
      let isJoystickMoving = false;

      joystick.on('move', (evt, data) => {
        if (data.direction) {
          currentDirection = data.direction;
          isJoystickMoving = true;
        }
      });

      joystick.on('end', () => {
        isJoystickMoving = false;
      });

      // Función para mover la cámara continuamente
      function moveCameraLoop() {
        if (isJoystickMoving) {
          moveCamera(currentDirection);
        }
        requestAnimationFrame(moveCameraLoop);
      }

      // Iniciar el bucle de movimiento
      moveCameraLoop();

      function moveCamera(direction) {
        let vector = new THREE.Vector3();

        if (direction.y === 'up') {
          vector.z -= maxSpeed;
        } else if (direction.y === 'down') {
          vector.z += maxSpeed;
        }

        if (direction.x === 'left') {
          vector.x -= maxSpeed;
        } else if (direction.x === 'right') {
          vector.x += maxSpeed;
        }

        const camera = document.querySelector('[camera]');
        const cameraRotation = new THREE.Euler().setFromQuaternion(camera.object3D.quaternion, 'YXZ');
        vector.applyEuler(cameraRotation);

        const cameraRig = document.getElementById('cameraRig');
        cameraRig.object3D.position.x += vector.x;
        cameraRig.object3D.position.z += vector.z;
      }
    });
  </script>
